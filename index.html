<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHAPES! — Identify the Shape</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================
     DESIGN SYSTEM
  ============================ */
  :root {
    --green:       #008037;
    --green-dark:  #005a28;
    --green-mid:   #00a847;
    --green-light: #00d060;
    --yellow:      #FFE03A;
    --yellow-dark: #d4a800;
    --white:       #ffffff;
    --off-white:   #f8f6f2;
    --ink:         #1a1a2e;
    --ink-mid:     #444;
    --radius-card: 28px;
    --radius-btn:  18px;
    --shadow-card: 0 12px 40px rgba(0,0,0,0.20);
    /* 4 button accent colours */
    --c1-bg: #FF6B6B; --c1-sh: #c0392b; --c1-fg: #fff;
    --c2-bg: #48CAE4; --c2-sh: #0096c7; --c2-fg: #fff;
    --c3-bg: #F9C74F; --c3-sh: #c99400; --c3-fg: #1a1a2e;
    --c4-bg: #9B5DE5; --c4-sh: #7209b7; --c4-fg: #fff;

    /* Safe fallback fonts in case Google Fonts fails */
    --font-display: 'Fredoka One', 'Comic Sans MS', 'Chalkboard SE', cursive;
    --font-body:    'Nunito', 'Helvetica Rounded', 'Arial Rounded MT Bold', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-body);
    background: #008037;
    background: var(--green, #008037);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle dot-grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 34px 34px;
    pointer-events: none; z-index: 0;
  }

  /* ============================
     SCREEN SYSTEM
  ============================ */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.96);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .screen.active {
    opacity: 1;
    pointer-events: all;
    transform: scale(1);
  }

  /* ============================
     START SCREEN
  ============================ */
  #startScreen {
    /* Hard-coded fallback — CSS vars can fail in some renderers */
    background: #008037;
    background: var(--green, #008037);
  }
  .start-logo {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 12vw, 7rem);
    color: var(--white);
    text-shadow: 0 6px 0 rgba(0,0,0,0.18);
    letter-spacing: 6px;
    line-height: 1;
    text-align: center;
  }
  .start-tagline {
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    text-align: center;
  }

  /* Floating preview shapes */
  .preview-row {
    display: flex;
    gap: 10px;
    margin: 28px 0;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }
  .preview-thumb {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.13);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    overflow: hidden;
    padding: 4px;
    animation: float 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .preview-thumb:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .preview-thumb:nth-child(1) { animation-delay: 0s; }
  .preview-thumb:nth-child(2) { animation-delay: 0.3s; }
  .preview-thumb:nth-child(3) { animation-delay: 0.6s; }
  .preview-thumb:nth-child(4) { animation-delay: 0.9s; }
  .preview-thumb:nth-child(5) { animation-delay: 1.2s; }
  .preview-thumb:nth-child(6) { animation-delay: 1.5s; }
  .preview-thumb:nth-child(7) { animation-delay: 1.8s; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  .start-buttons {
    display: flex; flex-direction: column;
    align-items: center; gap: 12px;
  }
  .btn-primary {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 2rem);
    padding: 16px 52px;
    border-radius: 50px;
    border: none; cursor: pointer;
    background: var(--yellow);
    color: var(--green-dark);
    box-shadow: 0 7px 0 var(--yellow-dark), 0 0 40px rgba(255,224,58,0.3);
    letter-spacing: 2px;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative; overflow: hidden;
  }
  .btn-primary:hover  { transform: translateY(-3px); box-shadow: 0 10px 0 var(--yellow-dark), 0 0 50px rgba(255,224,58,0.5); }
  .btn-primary:active { transform: translateY(4px);  box-shadow: 0 2px 0 var(--yellow-dark); }

  .btn-secondary {
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 800;
    padding: 10px 28px;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.5);
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.9);
    letter-spacing: 1px;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.8); }
  .btn-secondary:active { transform: scale(0.97); }

  /* ============================
     MEET THE SHAPES MODAL
  ============================ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,70,30,0.92);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal-card {
    background: var(--off-white);
    border-radius: var(--radius-card);
    padding: 24px 20px 20px;
    width: 100%; max-width: 560px;
    box-shadow: var(--shadow-card);
    max-height: 90dvh;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
    animation: slideUp 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-title {
    font-family: var(--font-display);
    font-size: 1.6rem;
    color: var(--green-dark);
    text-align: center;
    letter-spacing: 1px;
  }
  .modal-hint {
    font-size: 0.85rem;
    color: #777;
    text-align: center;
    font-weight: 700;
    margin-top: -8px;
    letter-spacing: 0.5px;
  }

  .meet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .meet-card {
    background: #fff;
    border-radius: 18px;
    border: 3px solid transparent;
    padding: 10px 8px 8px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }
  .meet-card:hover     { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
  .meet-card.ringing   { border-color: var(--green); background: #e8faf0; animation: ringPulse 0.4s ease; }
  @keyframes ringPulse {
    0%,100% { transform: scale(1); }
    40%     { transform: scale(1.07); }
  }

  .meet-img-wrap {
    width: 80px; height: 80px;
    overflow: hidden; position: relative;
    border-radius: 12px;
    background: #f0f0f0;
  }
  .meet-img-wrap img {
    /* positioned by JS applyZoom */
    position: absolute;
    width: 200%;
    height: auto;
    left: -50%;
    top: 0%;
  }
  .meet-name {
    font-family: var(--font-display);
    font-size: 0.95rem;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  .modal-close-btn {
    font-family: var(--font-display);
    font-size: 1.1rem;
    padding: 14px;
    border-radius: 50px;
    border: none; cursor: pointer;
    background: var(--green);
    color: #fff;
    box-shadow: 0 5px 0 var(--green-dark);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }
  .modal-close-btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 var(--green-dark); }
  .modal-close-btn:active { transform: translateY(3px);  box-shadow: 0 1px 0 var(--green-dark); }

  /* ============================
     GAME SCREEN
  ============================ */
  #gameScreen {
    justify-content: flex-start;
    padding-top: clamp(12px, 3vh, 24px);
  }

  .game-header {
    width: 100%; max-width: 620px;
    display: flex;
    align-items: center; gap: 12px;
    padding: 0 4px;
    margin-bottom: clamp(10px, 2vh, 18px);
    flex-shrink: 0;
  }
  /* Score badge - shows CORRECT count */
  .score-badge {
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--yellow);
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    white-space: nowrap;
    min-width: 56px;
    letter-spacing: 1px;
  }
  /* Progress bar - shows ROUND progress */
  .progress-track {
    flex: 1;
    height: 12px;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-light), var(--yellow));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 8px rgba(255,224,58,0.5);
    width: 0%;
  }
  .round-badge {
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: rgba(255,255,255,0.88);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  /* Question card */
  .question-card {
    background: var(--off-white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: clamp(16px, 3vw, 24px);
    width: 100%; max-width: 620px;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(12px, 2.5vh, 18px);
    position: relative; overflow: hidden;
    flex-shrink: 0;
  }
  .question-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--green), var(--green-light), var(--green));
  }

  .question-label {
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 900;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Shape display — overflow hidden to crop blank SVG canvas */
  .shape-display {
    width: clamp(180px, 42vw, 260px);
    height: clamp(180px, 42vw, 260px);
    overflow: hidden;
    position: relative;
    border-radius: 20px;
    background: rgba(0,0,0,0.02);
    flex-shrink: 0;
  }
  /* 
   * FIX: SVG viewBox is 0 0 1440 810. 
   * Shapes span roughly x=350–1100 (750px wide), y=80–650 (570px tall),
   * centred ~(720, 365) = (50%, 45%) of canvas.
   * We display the img at 2.3× the container width to zoom in,
   * then offset so the shape centre lands at the container centre.
   *
   * Container = C×C. Img display-width = 2.3C, height = 2.3C × (810/1440).
   * Shape centre in displayed img = (50% × 2.3C, 45% × 2.3C × 810/1440)
   *                               = (1.15C, 0.585C).
   * Offset to move that centre to (C/2, C/2):
   *   left = C/2 - 1.15C  = -0.65C
   *   top  = C/2 - 0.585C = -0.085C  ≈ -8.5%
   *
   * We express as % of container using CSS custom property.
   */
  .shape-img {
    position: absolute;
    /* width / left / top set per-shape by JS — SHAPE_DISPLAY table */
    width: 200%;
    height: auto;
    left: -50%;
    top: 0%;
    transition: opacity 0.25s;
  }
  /* Bounce-in animation for new question */
  .shape-display.bounce-in .shape-img {
    animation: shapeEntry 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }
  @keyframes shapeEntry {
    0%   { transform: scale(0.45); opacity: 0; }
    70%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  /* Wrong-answer shake on the display */
  .shape-display.shake {
    animation: shapShake 0.5s ease;
  }
  @keyframes shapShake {
    0%,100% { transform: rotate(0deg); }
    20%     { transform: rotate(-4deg); }
    40%     { transform: rotate(4deg); }
    60%     { transform: rotate(-3deg); }
    80%     { transform: rotate(3deg); }
  }

  /* 4-choice grid */
  .choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(10px, 2vw, 14px);
    width: 100%;
  }
  .choice-btn {
    font-family: var(--font-display);
    font-size: clamp(1.05rem, 3.2vw, 1.5rem);
    padding: clamp(13px,2.5vh,18px) 10px;
    border-radius: var(--radius-btn);
    border: 3px solid transparent;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
    position: relative; overflow: hidden;
  }
  .choice-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    filter: brightness(1.06);
  }
  .choice-btn:active:not(:disabled) {
    transform: translateY(3px);
  }
  .choice-btn:disabled { cursor: default; filter: brightness(0.7) saturate(0.7); }

  /* Correct highlight — bright green ring + checkmark */
  .choice-btn.btn-correct {
    border-color: #27ae60 !important;
    box-shadow: 0 0 0 3px #27ae60, 0 6px 0 #1a7a40 !important;
    filter: none !important;
    animation: correctPop 0.4s ease;
  }
  @keyframes correctPop {
    0%,100% { transform: scale(1); }
    40%     { transform: scale(1.08); }
  }
  /* Wrong highlight */
  .choice-btn.btn-wrong {
    border-color: #e74c3c !important;
    filter: brightness(0.6) saturate(0.5) !important;
  }

  /* ============================
     REINFORCEMENT OVERLAY
     (z-index 200, above confetti 50)
  ============================ */
  .reinforce-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .reinforce-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }
  .reinforce-bg {
    position: absolute; inset: 0;
    transition: background 0.2s;
  }
  .reinforce-content {
    position: relative;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: reinforceIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes reinforceIn {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .reinforce-emoji {
    font-size: clamp(3rem, 10vw, 5rem);
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }
  .reinforce-main {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    color: #fff;
    text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    letter-spacing: 3px;
  }
  /* Shape preview inside reinforce overlay */
  .reinforce-shape-wrap {
    width: clamp(100px, 20vw, 140px);
    height: clamp(100px, 20vw, 140px);
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,0.18);
    position: relative;
    flex-shrink: 0;
  }
  .reinforce-shape-wrap img {
    position: absolute;
    /* set per-shape by JS */
    width: 200%;
    height: auto;
    left: -50%;
    top: 0%;
  }
  .reinforce-name {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,0.25);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* ============================
     END SCREEN
  ============================ */
  .end-card {
    background: var(--off-white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: clamp(28px,5vw,44px) clamp(24px,4vw,40px);
    text-align: center;
    max-width: 460px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: slideUp 0.45s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .end-emoji     { font-size: clamp(4rem, 12vw, 6rem); line-height: 1; }
  .end-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: var(--green-dark);
    letter-spacing: 2px;
  }
  .end-msg {
    font-size: clamp(0.9rem,2.5vw,1.15rem);
    font-weight: 700;
    color: #666;
    max-width: 320px;
    line-height: 1.5;
  }
  .end-score-line {
    font-family: var(--font-display);
    font-size: clamp(1.8rem,5vw,2.6rem);
    color: var(--green);
    letter-spacing: 2px;
  }
  .end-stars {
    font-size: clamp(1.4rem,4vw,2rem);
    letter-spacing: 3px;
    min-height: 2.5rem;
  }
  .btn-play-again {
    font-family: var(--font-display);
    font-size: 1.3rem;
    padding: 14px 44px;
    border-radius: 50px;
    border: none; cursor: pointer;
    background: var(--green);
    color: #fff;
    box-shadow: 0 6px 0 var(--green-dark);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .btn-play-again:hover  { transform: translateY(-3px); box-shadow: 0 9px 0 var(--green-dark); }
  .btn-play-again:active { transform: translateY(3px);  box-shadow: 0 2px 0 var(--green-dark); }

  /* ============================
     CONFETTI  (z-index 50, below overlay)
  ============================ */
  .confetti-piece {
    position: fixed;
    top: -16px;
    pointer-events: none;
    z-index: 50;
    animation: confettiFall var(--dur, 1.5s) ease-in var(--del, 0s) forwards;
    border-radius: var(--shape-r, 2px);
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg) scale(0.2); opacity: 0; }
  }

  /* ============================
     TTS indicator (subtle)
  ============================ */
  .tts-badge {
    font-size: 0.75rem;
    font-weight: 800;
    color: rgba(255,255,255,0.55);
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 4px;
  }
  .tts-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); }
</style>
</head>
<body>

<!-- ========================
     START SCREEN
========================= -->
<div id="startScreen" class="screen active">
  <div class="start-logo">SHAPES!</div>
  <div class="start-tagline">Can you name them all?</div>
  <div class="preview-row" id="previewRow"></div>
  <div class="start-buttons">
    <button class="btn-primary" onclick="startGame()">▶&nbsp; PLAY!</button>
    <button class="btn-secondary" onclick="openMeetShapes()">👀 &nbsp;Meet the Shapes First</button>
  </div>
</div>

<!-- ========================
     MEET THE SHAPES MODAL
========================= -->
<div id="meetModal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-title">Meet the Shapes! 👋</div>
    <div class="modal-hint">TAP ANY SHAPE TO HEAR ITS NAME</div>
    <div class="meet-grid" id="meetGrid"></div>
    <button class="modal-close-btn" onclick="closeMeetShapes()">✓ &nbsp;Got it — Let's Play!</button>
  </div>
</div>

<!-- ========================
     GAME SCREEN
========================= -->
<div id="gameScreen" class="screen">
  <div class="game-header">
    <!-- LEFT: shows correct-answer SCORE -->
    <div class="score-badge" id="scoreText">★ 0</div>
    <!-- MIDDLE: shows ROUND progress -->
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <!-- RIGHT: round counter -->
    <div class="round-badge" id="roundText">1 / 10</div>
  </div>

  <div class="question-card">
    <div class="question-label">🔍 What shape is this?</div>
    <div class="shape-display" id="shapeDisplay">
      <img class="shape-img" id="shapeImg" src="" alt="shape to identify">
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
  </div>
</div>

<!-- ========================
     END SCREEN
========================= -->
<div id="endScreen" class="screen">
  <div class="end-card">
    <div class="end-emoji" id="endEmoji">🎉</div>
    <div class="end-title"  id="endTitle">Great job!</div>
    <div class="end-msg"    id="endMsg">You really know your shapes!</div>

/* ================================================
   PER-SHAPE ZOOM TABLE  (fixes rectangle≠square, full heart)
   
   SVG canvas: 1440×810. Each shape has different bounds.
   zoom% = 82% fill × 1440 / max(shape_width, shape_height)
   
   Offsets centre the shape in its container:
   left% = 100 × (0.5 - center_x × zoom/1440)
   top%  = 100 × (0.5 - center_y × zoom/1440)
   
   Full character extents (body + hands + feet), from SVG clip-path data:
   Circle    x=350–1090  y=89–728   (hands at sides, feet at bottom)
   Heart     x=373–1039  y=81–729   (full heart shape + feet)
   Oval      x=413–911   y=81–729   (arms + feet)
   Rectangle x=254–1233  y=83–727   (wide arm extensions left + right)
   Square    x=448–993   y=81–729   (arms + feet)
   Star      x=393–1019  y=81–729   (points + feet)
   Triangle  x=411–1003  y=81–721   (arms + feet)
================================================ */
const SHAPE_DISPLAY = {
  // Each shape sized so the FULL character (body + hands + feet) fills 90% of container.
  // Bounds measured from actual SVG clip-path coordinates (canvas: 1440 × 810).
  // zoom W% = 90% × 1440 / max(shape_width, shape_height)
  // left/top centre the character in the container.
  // All values verified: 13px safety margin on every edge at 260px container.
  circle:    { w: 175, l: -37.6, t:   0.3 },   // hands x=350–1090, feet y=728
  heart:     { w: 195, l: -45.4, t:  -4.7 },   // full heart+feet x=373–1039, y=81–729
  oval:      { w: 200, l: -41.9, t:  -6.2 },   // arms x=413–911,  feet y=729
  rectangle: { w: 132, l: -18.4, t:  12.8 },   // wide arms x=254–1233 (widest shape)
  square:    { w: 200, l: -50.1, t:  -6.2 },   // x=448–993, feet y=729
  star:      { w: 200, l: -48.1, t:  -6.2 },   // points+feet x=393–1019, y=81–729
  triangle:  { w: 202, l: -49.4, t:  -6.4 },   // x=411–1003, feet y=721
};

/**
 * Apply per-shape zoom & centering offset to any <img>.
 * @param {HTMLImageElement} imgEl
 * @param {string} key  — shape key, e.g. 'rectangle'
 */
function applyZoom(imgEl, key) {
  const d = SHAPE_DISPLAY[key] || { w: 200, l: -50, t: 0 };
  imgEl.style.width = d.w + '%';
  imgEl.style.left  = d.l + '%';
  imgEl.style.top   = d.t + '%';
}

/* ================================================
   WEB SPEECH API  (FIX: pronunciation for ESL)
================================================ */
let ttsReady = false;

function speak(text) {
  if (!window.speechSynthesis) return;
  // Cancel any in-progress speech
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang  = 'en-US';
  u.rate  = 0.82;
  u.pitch = 1.15;
  u.volume = 1;
  speechSynthesis.speak(u);
  ttsReady = true;
}

// Unlock TTS on first user gesture (required by some browsers)
function unlockTTS() {
  if (!ttsReady && window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(u);
    ttsReady = true;
  }
}

/* ================================================
   WEB AUDIO API  (sound effects)
================================================ */
let audioCtx = null;

function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function tone(freq, type, startOffset, duration, vol = 0.28) {
  try {
    const ctx  = getAC();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + startOffset;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t);
    osc.stop(t + duration + 0.05);
  } catch(e) {}
}

function sfxCorrect() {

   UTILITIES
================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = 0 | Math.random() * (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// FIX: generate 10 questions ensuring NO CONSECUTIVE REPEATS
function buildQuestions() {
  // 7 shapes + 3 extras to reach 10
  const extras = shuffle(SHAPES).slice(0, TOTAL_ROUNDS - SHAPES.length);
  let pool = shuffle([...SHAPES, ...extras]);

  // Repair any adjacent duplicates
  for (let i = 1; i < pool.length; i++) {
    if (pool[i].key === pool[i - 1].key) {
      // Swap with the next non-duplicate
      let swapped = false;
      for (let j = i + 1; j < pool.length; j++) {
        if (pool[j].key !== pool[i - 1].key) {
          [pool[i], pool[j]] = [pool[j], pool[i]];
          swapped = true;
          break;
        }
      }
      // If no forward swap possible, swap backwards
      if (!swapped && i >= 2 && pool[i].key !== pool[i - 2].key) {
        [pool[i], pool[i - 1]] = [pool[i - 1], pool[i]];
      }
    }
  }
  return pool;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.toggle('active', s.id === id);
  });
}

    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const isCircle = Math.random() > 0.55;
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      width: ${7 + Math.random() * 10}px;
      height: ${7 + Math.random() * 10}px;
      background: ${colors[0 | Math.random() * colors.length]};
      --shape-r: ${isCircle ? '50%' : '3px'};
      --del: ${(Math.random() * 0.5).toFixed(2)}s;
      --dur: ${(1.1 + Math.random() * 0.9).toFixed(2)}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
}

/* ================================================
   MEET THE SHAPES MODAL
================================================ */
function buildMeetGrid() {
  const grid = document.getElementById('meetGrid');
  SHAPES.forEach(shape => {
    const card = document.createElement('div');
    card.className = 'meet-card';
    card.innerHTML = `
      <div class="meet-img-wrap">
        <img src="${SHAPE_IMAGES[shape.key]}" alt="${shape.name}" loading="lazy">
      </div>
      <div class="meet-name">${shape.name}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.meet-card').forEach(c => c.classList.remove('ringing'));
      card.classList.add('ringing');
      speak(shape.name);
    });
    grid.appendChild(card);
    // Apply per-shape zoom to the meet thumbnail
    applyZoom(card.querySelector('img'), shape.key);
  });
}

function openMeetShapes() {
  unlockTTS();
  getAC();
  document.getElementById('meetModal').classList.add('open');
}

function closeMeetShapes() {
  document.getElementById('meetModal').classList.remove('open');
}

/* ================================================
   PREVIEW ROW (start screen)
================================================ */
function buildPreviewRow() {
  const row = document.getElementById('previewRow');
  row.innerHTML = '';
  shuffle(SHAPES).forEach(shape => {
    const div = document.createElement('div');
    div.className = 'preview-thumb';
    div.title = shape.name;
    div.innerHTML = `<img src="${SHAPE_IMAGES[shape.key]}" alt="${shape.name}">`;
    div.addEventListener('click', () => speak(shape.name));
    row.appendChild(div);
  });
}

/* ================================================
   GAME FLOW
================================================ */
function startGame() {
  unlockTTS();
  getAC();
  closeMeetShapes();

  score     = 0;
  round     = 0;
  locked    = false;
  questions = buildQuestions();

  updateHeader();
  showScreen('gameScreen');
  nextQuestion();
}

function resetGame() {
  buildPreviewRow();
  showScreen('startScreen');
}

function updateHeader() {
  // FIX: score badge shows CORRECT count; progress bar shows ROUND progress separately
  document.getElementById('scoreText').textContent  = `★ ${score}`;
  document.getElementById('progressFill').style.width = `${(round / TOTAL_ROUNDS) * 100}%`;
  document.getElementById('roundText').textContent  = `${Math.min(round + 1, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
}

function nextQuestion() {
  if (round >= TOTAL_ROUNDS) { endGame(); return; }

  locked = false;
  const shape = questions[round];

  updateHeader();

  // Load shape image with per-shape zoom
  const img     = document.getElementById('shapeImg');
  const display = document.getElementById('shapeDisplay');
  img.src = SHAPE_IMAGES[shape.key];
  applyZoom(img, shape.key);

  // Trigger bounce-in (reset animation by removing + re-adding class)
  display.classList.remove('bounce-in', 'shake');
  void display.offsetWidth;            // force reflow
  display.classList.add('bounce-in');

  // Build 4 answer buttons with shuffled colours
  const others  = SHAPES.filter(s => s.key !== shape.key);
  const choices = shuffle([shape, ...shuffle(others).slice(0, 3)]);
  const colours = shuffle([...BTN_PALETTE]);

  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';

  choices.forEach((choice, i) => {
    const c   = colours[i];
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.name;
    btn.style.background = c.bg;
    btn.style.color      = c.fg;
    btn.style.boxShadow  = `0 6px 0 ${c.shadow}`;

    btn.addEventListener('click', () => {
      handleAnswer(choice.key === shape.key, btn, shape);
    });

    grid.appendChild(btn);
  });
}

function handleAnswer(isCorrect, clickedBtn, shape) {
  if (locked) return;
  locked = true;

  // Disable all buttons & mark correct/wrong
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === shape.name) btn.classList.add('btn-correct');
  });

  if (isCorrect) {
    clickedBtn.classList.add('btn-correct');
    score++;
    sfxCorrect();
    showReinforcement(true, shape);
    spawnConfetti(40);
  } else {
    clickedBtn.classList.add('btn-wrong');
    sfxWrong();
    // Shake shape display
    const display = document.getElementById('shapeDisplay');
    display.classList.remove('bounce-in');
    void display.offsetWidth;
    display.classList.add('shake');
    showReinforcement(false, shape);
  }

  round++;

  // FIX: 2200ms before next question so young learners can absorb the feedback
  setTimeout(() => {
    hideReinforcement();
    nextQuestion();
  }, 2200);
}

/* ================================================
   REINFORCEMENT OVERLAY  (FIX: z-index 200)
================================================ */
function showReinforcement(correct, shape) {
  const overlay  = document.getElementById('reinforceOverlay');
  const bg       = document.getElementById('reinforceBg');
  const emoji    = document.getElementById('reinEmoji');
  const main     = document.getElementById('reinMain');
  const shapeImg = document.getElementById('reinShapeImg');
  const name     = document.getElementById('reinName');

  shapeImg.src = SHAPE_IMAGES[shape.key];
  applyZoom(shapeImg, shape.key);
  name.textContent = shape.name.toUpperCase();

  if (correct) {
    emoji.textContent = '⭐';
    main.textContent  = 'CORRECT!';
    bg.style.background = 'rgba(32,140,70,0.93)';
  } else {
    emoji.textContent = '💙';
    main.textContent  = 'GOOD TRY!';
    bg.style.background = 'rgba(30,100,180,0.93)';
  }

  overlay.classList.add('visible');

  // FIX: speak the shape name so ESL students hear it clearly
  // Delay 180ms so audio tone finishes first
  setTimeout(() => speak(shape.name), 180);
}

function hideReinforcement() {
  document.getElementById('reinforceOverlay').classList.remove('visible');
}

/* ================================================
   END GAME
================================================ */
function endGame() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('scoreText').textContent = `★ ${score}`;

  const pct = score / TOTAL_ROUNDS;

  let emoji, title, msg;
  if (pct === 1)       { emoji = '🏆'; title = 'Perfect!';      msg = 'Amazing! You got every single shape right!'; }
  else if (pct >= 0.8) { emoji = '🎉'; title = 'Brilliant!';    msg = 'You really know your shapes!'; }
  else if (pct >= 0.6) { emoji = '😊'; title = 'Great Job!';    msg = 'Well done — keep practising!'; }
  else if (pct >= 0.4) { emoji = '💪'; title = 'Keep Going!';   msg = 'You\'re learning! Try again to improve.'; }
  else                 { emoji = '📚'; title = 'Let\'s Learn!'; msg = 'Visit "Meet the Shapes" to practise first!'; }

  document.getElementById('endEmoji').textContent = emoji;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent   = msg;
  document.getElementById('endScore').textContent = `${score} / ${TOTAL_ROUNDS}`;
  document.getElementById('endStars').textContent = '⭐'.repeat(score) + '☆'.repeat(TOTAL_ROUNDS - score);

  if (pct >= 0.7) {
    spawnConfetti(55);
    setTimeout(() => spawnConfetti(40), 550);
  }
  sfxComplete();
  showScreen('endScreen');
}

/* ================================================
   INITIALISE
================================================ */
buildPreviewRow();
buildMeetGrid();
// Start screen is .active by default in HTML
</script>
</body>
